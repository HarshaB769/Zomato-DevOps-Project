apiVersion: apps/v1
kind: Deployment

metadata:
  name: zomato
  labels:
    app: zomato

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zomato

  template:
    metadata:
      labels:
        app: zomato

    spec:
      containers:
        - name: zomato
          image: zomato-devops-project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000


